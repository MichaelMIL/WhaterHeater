; PlatformIO Project Configuration File
;
; ESP32-C2 relay controller
; NOTE: the official platformio espressif32 platform does not support the
; ESP32-C2 (Arduino core 2.x). We use the pioarduino fork, which ships
; Arduino core 3.x with ESP32-C2 support.

[env:esp32-c2]
; Pinned release, not "stable": pioarduino's PlatformIO core 6.2 ships SCons
; 4.11.1 while the 55.03.311 "stable" platform still asks for 4.8.1. The two
; then re-install each other's SCons *during* the build (deleting the folder
; SCons runs from) and the link step dies with "No module named
; SCons.Tool.FortranCommon". 55.03.312-1 pairs with SCons 4.11.1.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c2-devkitm-1
framework = arduino
monitor_speed = 115200
; --- OTA upload over WiFi: uncomment these two lines to flash without USB ---
; upload_protocol = espota
; upload_port = waterheater.local
; The ESP32-C2 is RV32IMC — no atomic (A) instruction extension. The
; pioarduino build passes no -march when compiling sources or linking, so
; gcc defaults to an arch WITH atomics: compiled code and the default
; libstdc++ multilib both end up with amoadd.w instructions that crash the
; C2 with "Guru Meditation Error: Illegal instruction" as soon as
; shared_ptr refcounting runs (e.g. WebServer accepting a client).
; build_flags fixes compilation; the extra script fixes the link command
; (PlatformIO does not forward -march from build_flags to the linker).
build_flags =
    -march=rv32imc_zicsr_zifencei
    -mabi=ilp32
extra_scripts = post:fix_link_march.py
lib_deps =
    witnessmenow/UniversalTelegramBot@^1.3.0
    bblanchon/ArduinoJson@^6.21.5
; The C2 idles with ~50KB free heap; a default mbedTLS handshake needs ~40KB
; at once and fails. Dynamic buffers allocate TLS memory only while in use
; and free certificate/config data after the handshake, cutting the peak
; enough for Telegram HTTPS to work reliably.
; (DTLS must be off: the Kconfig dynamic-buffer option depends on it.)
custom_sdkconfig =
    '# CONFIG_MBEDTLS_SSL_PROTO_DTLS is not set'
    CONFIG_MBEDTLS_DYNAMIC_BUFFER=y
    CONFIG_MBEDTLS_DYNAMIC_FREE_CA_CERT=y
    CONFIG_MBEDTLS_DYNAMIC_FREE_CONFIG_DATA=y
